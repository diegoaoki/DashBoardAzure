<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DashBoard Azure — Painel de Vendas</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">DashBoard<strong>Azure</strong></span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item active" data-view="visao-geral">
          <span class="nav-ico">▣</span> Visão geral
        </a>
        <a href="#" class="nav-item" data-view="vendas">
          <span class="nav-ico">▤</span> Vendas
        </a>
        <a href="#" class="nav-item" data-view="produtos">
          <span class="nav-ico">▦</span> Produtos
        </a>
        <a href="#" class="nav-item" data-view="regioes">
          <span class="nav-ico">◇</span> Regiões
        </a>
      </nav>
      <div class="sidebar-foot">
        <p>Dados de demonstração</p>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="toggleSidebar" aria-label="Menu">☰</button>
        <div class="topbar-title">
          <h1 id="viewTitle">Visão geral</h1>
          <p id="viewSubtitle">Resumo de desempenho — período atual</p>
        </div>
        <div class="topbar-actions">
          <label class="select">
            <span>Período</span>
            <select id="periodFilter">
              <option value="6">Últimos 6 meses</option>
              <option value="12" selected>Últimos 12 meses</option>
              <option value="3">Últimos 3 meses</option>
            </select>
          </label>
          <div class="avatar" title="Usuário">DF</div>
        </div>
      </header>

      <main class="content">
        <!-- KPI cards -->
        <section class="kpi-grid" id="kpiGrid"></section>

        <!-- Charts -->
        <section class="charts-grid">
          <article class="card chart-card chart-wide">
            <header class="card-head">
              <h2>Receita x Meta</h2>
              <span class="card-tag">R$</span>
            </header>
            <div class="chart-wrap"><canvas id="revenueChart"></canvas></div>
          </article>

          <article class="card chart-card">
            <header class="card-head">
              <h2>Vendas por categoria</h2>
            </header>
            <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
          </article>

          <article class="card chart-card">
            <header class="card-head">
              <h2>Receita por região</h2>
            </header>
            <div class="chart-wrap"><canvas id="regionChart"></canvas></div>
          </article>

          <article class="card chart-card chart-wide">
            <header class="card-head">
              <h2>Pedidos por dia da semana</h2>
            </header>
            <div class="chart-wrap"><canvas id="weekdayChart"></canvas></div>
          </article>
        </section>

        <!-- Table -->
        <section class="card table-card">
          <header class="card-head">
            <h2>Top produtos</h2>
            <input type="search" id="tableSearch" class="table-search" placeholder="Filtrar produto…" />
          </header>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Categoria</th>
                  <th class="num">Unid. vendidas</th>
                  <th class="num">Receita</th>
                  <th class="num">Variação</th>
                </tr>
              </thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
